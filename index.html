<!DOCTYPE html><html><head><title>Home - EarnHub VIP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:linear-gradient(135deg,#0f0c29,#302b63);color:#fff;padding-bottom:80px}
.glass{background:rgba(255,255,255,0.08);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:20px;margin:15px}
.balance-card{text-align:center} .balance-card h1{font-size:40px;color:#8d78ff}
.nav{position:fixed;bottom:0;width:100%;background:rgba(0,0,0,0.5);backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding:10px 0}
.nav a{color:#fff;text-decoration:none;font-size:12px;text-align:center}
</style></head><body>

<div class="glass balance-card">
<p>Your Balance</p><h1>Rs <span id="bal">0</span></h1>
</div>

<div class="glass">
<h3>📈 Active Plan</h3><div id="myplan">Loading...</div>
</div>

<div class="glass">
<h3>🎁 Referral Earnings</h3><p>Total: Rs <span id="refearn">0</span></p>
</div>

<div class="nav">
<a href="index.html">🏠<br>Home</a>
<a href="plans.html">📊<br>Plans</a>
<a href="deposit.html">💰<br>Deposit</a>
<a href="withdraw.html">🏦<br>Withdraw</a>
<a href="profile.html">👤<br>Profile</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAcPDFKm48dBxMOh9ESO3LusFcrTIKJc8M",authDomain:"earnhub-d31f7.firebaseapp.com",projectId:"earnhub-d31f7"};
const app=initializeApp(firebaseConfig); const auth=getAuth(); const db=getFirestore();
onAuthStateChanged(auth,async u=>{ if(!u) location="login.html"; else load(u.uid) });
async function load(uid){ let d=await getDoc(doc(db,"users",uid)); let data=d.data(); 
  bal.innerText=data.balance; refearn.innerText=(data.referrals||0)*50;
  if(data.plan && Date.now()-data.plan.last>86400000 && data.plan.days>0){ 
    updateDoc(doc(db,"users",uid),{balance:increment(data.plan.daily),"plan.last":Date.now(),"plan.days":increment(-1)}); 
    if(data.plan.days<=1) updateDoc(doc(db,"users",uid),{plan:null}); 
  }
  myplan.innerHTML = data.plan ? `<b>Rs${data.plan.amount}</b><br>Rs${data.plan.daily}/day<br>Days: ${data.plan.days}` : `No Active Plan`;
}
</script></body></html>
